<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Kokosh — Base Pay</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font-family: system-ui, sans-serif; max-width: 480px; margin: 4rem auto; padding: 0 1rem; background: #0b0b12; color: #eee; }
    h1 { font-size: 1.3rem; }
    #status { margin-top: 1.5rem; padding: 1rem; border-radius: 8px; background: #1a1a2e; white-space: pre-wrap; word-break: break-all; font-size: 0.85rem; }
    button { background: #0000FF; color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 8px; font-size: 1rem; cursor: pointer; }
    button:disabled { opacity: 0.6; cursor: default; }
  </style>
</head>
<body>
  <h1>Kokosh — Base Pay tip</h1>
  <p>Send a $0.05 USDC tip to the courier relay wallet. One tap, gas sponsored. Asks for your email (Private Profile Vault) before completing — validated server-side.</p>
  <button id="pay">Pay $0.05 with Base</button>
  <div id="status"></div>

  <script type="module">
    import { pay, getPaymentStatus } from "https://esm.sh/@base-org/account@2.5.7";

    const statusEl = document.getElementById("status");
    const btn = document.getElementById("pay");
    const COURIER = "0xf2035170A3B5106DBD4c98853D3C9E52c77eA4E6";

    btn.addEventListener("click", async () => {
      btn.disabled = true;
      statusEl.textContent = "Opening Base Pay...";
      try {
        const payment = await pay({
          amount: "0.05",
          to: COURIER,
          testnet: false,
          payerInfo: {
            requests: [{ type: "email" }],
            callbackURL: "https://kokosh-agent.vercel.app/pay/validate",
          },
        });

        statusEl.textContent = `Submitted.\nid: ${payment.id}\nChecking status...`;

        const status = await getPaymentStatus({ id: payment.id, testnet: false });
        statusEl.textContent =
          `Payment ${status.status}.\nid: ${payment.id}\n\n` + JSON.stringify({ payment, status }, null, 2);
      } catch (err) {
        statusEl.textContent = "Error: " + (err?.message ?? String(err));
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
